[package]
name = "twitch-irc-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
humantime = "2.4.0"
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
